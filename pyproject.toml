[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "word-extractor"
version = "0.1.0"
description = "유튜브 영상 title + description에서 일별·영상별 핵심 키워드를 추출하는 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "huggingface_hub>=1.25",
    "kiwipiepy==0.23.2",
    "numpy>=2.0",
    "pandas>=2.0",
    "sentence-transformers>=5.0",
    "torch>=2.0",
    "transformers>=4.40",
    "wordcloud>=1.9",
]

[project.scripts]
word-extractor = "pipeline:main"

[dependency-groups]
dev = [
    "pandas-stubs>=3.0.5.260730",
]
